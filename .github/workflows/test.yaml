---
name: Tests

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.package.name }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
        package:
        - name: ol-concourse
          test_path: pipeline_lib/tests/
        - name: ol-concourse-github-issues
          test_path: resources/github-issues/tests/
        - name: ol-concourse-npm
          test_path: resources/npm/tests/
        - name: ol-concourse-packer
          test_path: resources/packer/tests/
        - name: ol-concourse-pulumi
          test_path: resources/pulumi/tests/
        - name: ol-concourse-pypi
          test_path: resources/pypi/tests/
        - name: ol-concourse-github-deployments
          test_path: resources/github-deployments/tests/
        - name: ol-concourse-release
          test_path: resources/release/tests/

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4   # v10.1.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Run tests
      run: >-
        uv run --package ${{ matrix.package.name }}
        pytest ${{ matrix.package.test_path }} -v

  # Requiring `ci-gate` keeps the list of what must pass in the same file as the jobs it
  # names. `needs` on a matrix job aggregates every shard, so no shard count appears
  # anywhere.
  ci-gate:
    needs: [pytest]
    # Without this the gate is skipped when a dependency fails, and GitHub treats a
    # skipped required job as successful, allowing the PR to merge despite the failure.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Evaluate CI result
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        set -euo pipefail
        echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        # Read from `needs` rather than naming each job again: adding a job to the list
        # above is then the only edit, which is the entire point of this job. `skipped`
        # passes so that a job legitimately gated behind an `if:` does not wedge the
        # branch; `failure` and `cancelled` do not.
        failed=$(echo "$NEEDS" | jq -r '
          to_entries[]
          | select(.value.result != "success" and .value.result != "skipped")
          | .key')
        if [ -n "$failed" ]; then
          echo "::error::CI did not succeed: $(echo "$failed" | paste -sd, -)"
          exit 1
        fi
        echo "All CI jobs succeeded."
